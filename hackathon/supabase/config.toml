# Supabase Configuration for Responsible Betting Advisor
project_id = "serenity-pocket-ai"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 15
ignore_startup_parameters = "extra_float_digits"

[realtime]
enabled = true
port = 54324

[studio]
enabled = true
port = 54323

[storage]
enabled = true
port = 54325
file_size_limit = "50MiB"

[auth]
enabled = true
port = 54326
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
disable_signup = false
enable_confirmations = false

[auth.email]
enable_signup = true
enable_confirmations = false
template = "confirmation"

[auth.sms]
enable_signup = false
enable_confirmations = false

[edge_runtime]
enabled = true
port = 54327
inspector_port = 54328