# Supabase Deployment Configuration
# This file contains the deployment settings for Responsible Betting Advisor

name: serenity-pocket-ai
type: web
region: us-east-1

# Environment variables
env:
  - name: NODE_ENV
    value: production
  - name: SUPABASE_URL
    value: ${SUPABASE_URL}
  - name: SUPABASE_ANON_KEY
    value: ${SUPABASE_ANON_KEY}
  - name: RAPIDAPI_KEY
    value: ${RAPIDAPI_KEY}

# Build configuration
build:
  command: echo "Static site - no build required"
  output: .

# Deployment configuration
deploy:
  strategy: static
  directory: .
  index: index.html
  error: index.html

# Health check
health_check:
  path: /
  interval: 30
  timeout: 10

# Scaling
scaling:
  min_instances: 1
  max_instances: 3
  target_cpu_utilization: 70

# Security
security:
  headers:
    X-Frame-Options: DENY
    X-Content-Type-Options: nosniff
    X-XSS-Protection: 1; mode=block
    Referrer-Policy: strict-origin-when-cross-origin